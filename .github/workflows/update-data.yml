name: Update Vietnam Lottery Data

on:
  schedule:
    - cron: '45 9 * * *'  # XSMN 16:45 Vietnam
    - cron: '45 10 * * *' # XSMT 17:45 Vietnam
    - cron: '45 11 * * *' # XSMB 18:45 Vietnam
    - cron: '15 14 * * *' # 21:15 Vietnam: catch up all 3 regions
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml' # one-time smoke run when configuration is deployed

permissions:
  contents: write
concurrency:
  group: vietnam-lottery-write-main
  cancel-in-progress: false
jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test without network
        run: python -m unittest discover -s tests -v
      - name: Fetch region for scheduled time
        id: fetch
        continue-on-error: true # persist any successfully fetched draws before reporting partial failure
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          case "$EVENT_SCHEDULE" in
            "45 9 * * *") REGION="MN" ;;
            "45 10 * * *") REGION="MT" ;;
            "45 11 * * *") REGION="MB" ;;
            "15 14 * * *") REGION="" ;;
            "") REGION="" ;;
            *) echo "Unexpected schedule: $EVENT_SCHEDULE"; exit 1 ;;
          esac
          if [[ -z "$REGION" ]]; then
            python -m src.fetch
          else
            python -m src.fetch --region "$REGION"
          fi
      - name: Audit legacy results; fail only on structural errors
        run: python -m src.data_quality --output data/data-quality-report.json
      - name: Generate descriptive statistics
        run: python -m src.lottery_analyzer
      - name: Commit only changed data
        shell: bash
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/
          if git diff --cached --quiet; then
            echo 'No new data to commit.'
            exit 0
          fi
          git commit -m "Update lottery data $(date +'%Y-%m-%d')"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Report incomplete fetching after persisting successful draws
        if: steps.fetch.outcome == 'failure'
        run: |
          echo 'Fetching was incomplete. Successfully collected results were saved, but review logs and retry missed dates.'
          exit 1
