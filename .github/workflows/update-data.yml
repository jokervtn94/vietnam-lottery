name: Update Vietnam Lottery Data

on:
  schedule:
    # GitHub cron is UTC. These are intended Vietnam local times (UTC+7).
    - cron: '45 9 * * *'   # 16:45 MN
    - cron: '25 10 * * *'  # 17:25 MN retry
    - cron: '45 10 * * *'  # 17:45 MT
    - cron: '25 11 * * *'  # 18:25 MT retry
    - cron: '45 11 * * *'  # 18:45 MB
    - cron: '25 12 * * *'  # 19:25 MB retry
    - cron: '15 14 * * *'  # 21:15 all-region catch-up
    - cron: '25 15 * * *'  # 22:25 all-region retry
    - cron: '25 1 * * *'   # 08:25 next-morning recovery for yesterday
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml' # one-time smoke run when configuration is deployed

permissions:
  contents: write
concurrency:
  group: vietnam-lottery-write-main
  cancel-in-progress: false
jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test without network
        run: python -m unittest discover -s tests -v
      - name: Fetch regions eligible by actual Vietnam local time
        id: fetch
        continue-on-error: true # persist successful draws, then report any failures
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          # A scheduled run can be delayed by hours and start after midnight.
          # Do not fetch an unfinished new day's draw because an old cron fires late.
          VN_HHMM="$(date +'%H%M')"
          VN_TODAY="$(date +'%F')"
          VN_YESTERDAY="$(date -d 'yesterday' +'%F')"
          echo "Scheduled cron: ${EVENT_SCHEDULE:-manual/push}; Vietnam time: $(date '+%F %H:%M:%S %Z')"
          FAILED=0
          for entry in "MN:1645" "MT:1745" "MB:1845"; do
            IFS=':' read -r REGION CUTOFF <<< "$entry"
            END_DATE="$VN_YESTERDAY"
            if (( 10#$VN_HHMM >= 10#$CUTOFF )); then
              END_DATE="$VN_TODAY"
            fi
            echo "Fetching $REGION only through $END_DATE (cutoff $CUTOFF VN)"
            if ! python -m src.fetch --region "$REGION" --end "$END_DATE"; then
              FAILED=1
            fi
          done
          exit "$FAILED"
      - name: Audit legacy results; fail only on structural errors
        run: python -m src.data_quality --output data/data-quality-report.json
      - name: Generate descriptive statistics
        run: python -m src.lottery_analyzer
      - name: Commit only changed data
        shell: bash
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add data/
          if git diff --cached --quiet; then
            echo 'No new data to commit.'
            exit 0
          fi
          git commit -m "Update lottery data $(date +'%Y-%m-%d')"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Report incomplete fetching after persisting successful draws
        if: steps.fetch.outcome == 'failure'
        run: |
          echo 'Fetching was incomplete. Successfully collected results were saved, but review logs and retry missed dates.'
          exit 1
