
name: Update Vietnam Lottery Data

on:
  # 11:45 UTC = 18:45 Vietnam (UTC+7)
  schedule:
    - cron: '45 11 * * *'

  # Cho phép chạy thủ công khi cần
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vietnam-lottery-write-main
  cancel-in-progress: false

jobs:
  update-data:
    name: Update Lottery Results
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    env:
      TZ: Asia/Ho_Chi_Minh

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # 3. Install dependencies
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # 4. Run tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # 5. Fetch lottery data
      - name: Fetch Vietnam lottery results
        id: fetch
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail

          echo "======================================"
          echo "VIETNAM LOTTERY AUTO UPDATE"
          echo "======================================"
          echo "Local time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Workflow event: ${{ github.event_name }}"

          VN_HHMM="$(date +'%H%M')"
          VN_TODAY="$(date +'%F')"
          VN_YESTERDAY="$(date -d 'yesterday' +'%F')"

          FAILED=0

          # MN: 16:45
          # MT: 17:45
          # MB: 18:45
          for entry in "MN:1645" "MT:1745" "MB:1845"; do

            IFS=':' read -r REGION CUTOFF <<< "$entry"

            END_DATE="$VN_YESTERDAY"

            if (( 10#$VN_HHMM >= 10#$CUTOFF )); then
              END_DATE="$VN_TODAY"
            fi

            echo "--------------------------------------"
            echo "Region: $REGION"
            echo "End date: $END_DATE"
            echo "--------------------------------------"

            if python -m src.fetch \
              --region "$REGION" \
              --end "$END_DATE"; then

              echo "Fetch completed: $REGION"

            else

              echo "::warning::Fetch failed: $REGION"
              FAILED=1

            fi

          done

          exit "$FAILED"

      # 6. Audit data quality
      - name: Validate lottery data
        run: |
          python -m src.data_quality \
            --output data/data-quality-report.json

      # 7. Generate statistics
      - name: Generate lottery statistics
        run: python -m src.lottery_analyzer

      # 8. Commit updated data
      - name: Commit and push updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new lottery data to commit."
            exit 0
          fi

          git commit -m \
            "Update lottery data $(date +'%Y-%m-%d')"

          git push origin HEAD:main

          echo "Lottery data successfully pushed."

      # 9. Report fetching errors
      - name: Report incomplete fetching
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Lottery fetching was incomplete."
          echo "Successfully collected data has been saved."
          echo "Review logs and retry missing dates."
          exit 1
